name: Publish CRP Book & Film Sprite Pages
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sprite-arcade.html'
      - 'film-guide.html'
      - 'book-atlas.html'
      - 'witness-crosswalk-002.html'
      - 'suburbia.html'
      - 'episodes/**'
      - 'agents/**'
      - 'crp.dlw/**'
      - 'README.md'
      - '.github/workflows/sprite-pages.yml'
      - '.nojekyll'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the canonical archive
        uses: actions/checkout@v4
      - name: Verify required book-film artifacts
        shell: bash
        run: |
          set -euo pipefail
          for path in index.html sprite-arcade.html film-guide.html book-atlas.html witness-crosswalk-002.html suburbia.html episodes/B001-garret.html episodes/B002-marmeladovs-tavern.html episodes/F001-perfect-surface.html episodes/F002-fracture.html README.md; do
            test -s "$path"
            echo "PASS: $path"
          done
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('sprite-arcade.html').read_text(encoding='utf-8')
          assert html.count('data-panel=') == 6, 'Expected six homepage panels'
          assert all(p in html for p in ('episodes/B001-garret.html','episodes/B002-marmeladovs-tavern.html','episodes/F001-perfect-surface.html','episodes/F002-fracture.html','witness-crosswalk-002.html'))
          atlas = Path('book-atlas.html').read_text(encoding='utf-8')
          assert atlas.count('class="chapter"') == 41, 'Expected 41 book reading units'
          for episode in ('episodes/B002-marmeladovs-tavern.html','episodes/F002-fracture.html'):
            data = Path(episode).read_text(encoding='utf-8')
            assert data.count('data-comic=') == 3, f'Expected three original cartoon panels: {episode}'
            assert 'COMPARE WITNESSES' in data and 'SEAL EPISODE' in data
          print('PASS: four playable episodes; six front-page panels; 41-unit atlas; crosswalk and audit controls')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static files
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
