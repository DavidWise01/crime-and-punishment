name: Publish CRP Book & Film Sprite Pages
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sprite-arcade.html'
      - 'film-guide.html'
      - 'suburbia.html'
      - 'episodes/**'
      - 'agents/**'
      - 'crp.dlw/**'
      - 'README.md'
      - '.github/workflows/sprite-pages.yml'
      - '.nojekyll'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the canonical archive
        uses: actions/checkout@v4
      - name: Verify required book-film artifacts
        shell: bash
        run: |
          set -euo pipefail
          for path in index.html sprite-arcade.html film-guide.html suburbia.html episodes/B001-garret.html episodes/F001-perfect-surface.html README.md; do
            test -s "$path"
            echo "PASS: $path"
          done
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('sprite-arcade.html').read_text(encoding='utf-8')
          assert html.count('data-panel=') == 6, 'Expected six homepage panels'
          assert 'episodes/B001-garret.html' in html and 'episodes/F001-perfect-surface.html' in html
          print('PASS: both playable tracks and six original artwork panels')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static files
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
